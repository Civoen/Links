<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links Admin</title>
  <style>
    :root {
      --bg: #121212; --surface: #181818; --surface-raised: #202020;
      --border: #2a2a2a; --text: #ffffff; --text-secondary: #a7a7a7;
      --text-muted: #6a6a6a; --accent: #1db954; --accent-text: #0b1a10;
      --danger: #e24b4a; --font-display: "Space Grotesk", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 60px 24px; }
    h1 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 6px; }
    input, textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; color: var(--text); font-size: 14px; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    .track-block { background: var(--surface); border-radius: 12px; padding: 16px; margin-top: 16px; }
    .track-block h2 { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    button {
      font-family: var(--font-display); font-weight: 600; font-size: 14px; border-radius: 20px;
      padding: 11px 22px; cursor: pointer; border: none; margin-top: 24px;
    }
    .btn-save { background: var(--accent); color: var(--accent-text); }
    .btn-save:disabled { opacity: 0.6; cursor: default; }
    .status { font-size: 13px; margin-top: 12px; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--accent); }
    .login-card { background: var(--surface); border-radius: 12px; padding: 24px; margin-top: 40px; }
    .cover-preview { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; margin-top: 8px; display: block; background: var(--surface-raised); }
  </style>
</head>
<body>
<main>
  <h1>Links Admin</h1>

  <div id="login-view" class="login-card">
    <label for="password-input">Password</label>
    <input type="password" id="password-input" autocomplete="current-password" />
    <button class="btn-save" id="login-btn">Sign in</button>
    <p class="status error" id="login-error" style="display:none;"></p>
  </div>

  <div id="editor-view" style="display:none;">
    <label for="subtext-input">Hero subtext</label>
    <textarea id="subtext-input"></textarea>

    <div class="track-block">
      <h2>Track 1</h2>
      <label for="track0-title">Title</label>
      <input type="text" id="track0-title" />
      <label for="track0-artist">Artist</label>
      <input type="text" id="track0-artist" />
      <label for="track0-cover">Cover image URL</label>
      <input type="text" id="track0-cover" placeholder="https://..." />
      <img class="cover-preview" id="track0-preview" alt="" />
    </div>

    <div class="track-block">
      <h2>Track 2</h2>
      <label for="track1-title">Title</label>
      <input type="text" id="track1-title" />
      <label for="track1-artist">Artist</label>
      <input type="text" id="track1-artist" />
      <label for="track1-cover">Cover image URL</label>
      <input type="text" id="track1-cover" placeholder="https://..." />
      <img class="cover-preview" id="track1-preview" alt="" />
    </div>

    <button class="btn-save" id="save-btn">Save changes</button>
    <p class="status" id="save-status"></p>
  </div>
</main>

<script>
  let password = null;

  const els = {
    loginView: document.getElementById("login-view"),
    editorView: document.getElementById("editor-view"),
    passwordInput: document.getElementById("password-input"),
    loginBtn: document.getElementById("login-btn"),
    loginError: document.getElementById("login-error"),
    subtext: document.getElementById("subtext-input"),
    saveBtn: document.getElementById("save-btn"),
    saveStatus: document.getElementById("save-status")
  };

  function trackField(i, field) {
    return document.getElementById(`track${i}-${field}`);
  }

  async function loadContent() {
    const res = await fetch("/api/content");
    const content = await res.json();
    els.subtext.value = content.heroSubtext;
    content.tracks.forEach((track, i) => {
      trackField(i, "title").value = track.title;
      trackField(i, "artist").value = track.artist;
      trackField(i, "cover").value = track.coverUrl || "";
      updatePreview(i);
    });
  }

  function updatePreview(i) {
    const url = trackField(i, "cover").value.trim();
    const img = document.getElementById(`track${i}-preview`);
    img.src = url || "";
    img.style.visibility = url ? "visible" : "hidden";
  }

  [0, 1].forEach((i) => {
    trackField(i, "cover").addEventListener("input", () => updatePreview(i));
  });

  els.loginBtn.addEventListener("click", async () => {
    const attempt = els.passwordInput.value;
    if (!attempt) {
      els.loginError.textContent = "Enter a password first.";
      els.loginError.style.display = "block";
      return;
    }

    els.loginBtn.disabled = true;
    els.loginError.style.display = "none";

    try {
      const res = await fetch("/api/content", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: attempt, verifyOnly: true })
      });

      if (res.status === 401) {
        els.loginError.textContent = "Wrong password.";
        els.loginError.style.display = "block";
        return;
      }
      if (!res.ok) throw new Error("Login check failed");

      password = attempt;
      els.loginView.style.display = "none";
      els.editorView.style.display = "block";
      await loadContent();
    } catch {
      els.loginError.textContent = "Couldn't reach the server. Try again.";
      els.loginError.style.display = "block";
    } finally {
      els.loginBtn.disabled = false;
    }
  });

  els.saveBtn.addEventListener("click", async () => {
    const content = {
      heroSubtext: els.subtext.value.trim(),
      tracks: [0, 1].map((i) => ({
        title: trackField(i, "title").value.trim(),
        artist: trackField(i, "artist").value.trim(),
        coverUrl: trackField(i, "cover").value.trim()
      }))
    };

    els.saveBtn.disabled = true;
    els.saveStatus.textContent = "Saving…";
    els.saveStatus.className = "status";

    try {
      const res = await fetch("/api/content", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password, content })
      });

      if (res.status === 401) {
        els.saveStatus.textContent = "Wrong password. Sign in again.";
        els.saveStatus.className = "status error";
        els.editorView.style.display = "none";
        els.loginView.style.display = "block";
        password = null;
        return;
      }

      if (!res.ok) throw new Error("Save failed");

      els.saveStatus.textContent = "Saved. The live site picks this up on next page load.";
      els.saveStatus.className = "status success";
    } catch {
      els.saveStatus.textContent = "Couldn't save. Try again.";
      els.saveStatus.className = "status error";
    } finally {
      els.saveBtn.disabled = false;
    }
  });
</script>
</body>
</html>
