name: Release

# Two ways to run this:
# 1. Push a tag like v0.1.4 -> builds installers AND publishes them to a
#    real GitHub Release. Use this only when you actually want a new
#    shippable version.
# 2. Actions tab -> "Release" -> "Run workflow" button -> builds installers
#    and attaches them to that run as downloadable artifacts, with no tag
#    and no public release created. Use this to test whether a fix
#    actually builds, without adding to your tag list.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install libfuse (needed to build an AppImage on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - run: npm install

      - name: Build and publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK / CSC_KEY_PASSWORD / APPLE_* are deliberately left out
          # for now. Even referencing an unset secret passes an empty
          # string, which electron-builder treats as "here's a
          # certificate path" and fails trying to read it. Add these back
          # once real signing credentials exist in repo Settings > Secrets:
          #   CSC_LINK: ${{ secrets.CSC_LINK }}
          #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build only (manual test run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run dist

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: links-${{ matrix.os }}
          path: release/*
