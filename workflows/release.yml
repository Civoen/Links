name: Release

# Three ways to run this:
# 1. Push a tag like v0.1.4 -> builds installers AND publishes them to a
#    real GitHub Release. Use this only when you actually want a new
#    shippable version.
# 2. Publish a release on GitHub's website (Releases -> Draft a new
#    release -> Publish release) -> same result as #1. GitHub treats
#    "push a tag" and "publish a release" as genuinely different event
#    types even though the release UI also creates a tag as a side
#    effect, so both are listed explicitly below rather than relying on
#    the tag creation alone to trigger anything.
# 3. Actions tab -> "Release" -> "Run workflow" button -> builds installers
#    and attaches them to that run as downloadable artifacts, with no tag
#    and no public release created. Use this to test whether a fix
#    actually builds, without adding to your tag list.
#
# macOS is intentionally not built here. Without an Apple Developer
# Program membership ($99/year) to sign and notarize the app, current
# macOS versions don't just warn on unsigned Electron apps — they
# actively delete them on first launch based on the app's generic,
# unsigned identity, with no user override available. That's not a
# gatekeeper-style speed bump, it's a hard block, so there's no point
# shipping a macOS build that can't actually be opened. To bring it back
# once signing is affordable: add "macos-latest" back to the os list
# below, and uncomment the CSC_LINK/CSC_KEY_PASSWORD/APPLE_* lines further
# down once those secrets exist in repo Settings.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install libfuse (needed to build an AppImage on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      # github.ref is the reliable source of the tag for a push-triggered
      # run, but is documented as unreliable (sometimes empty) for a
      # release-triggered run — release events carry the tag in
      # github.event.release.tag_name instead. Computing this once here,
      # rather than repeating ad-hoc github.ref checks in every later
      # step, means every downstream step works correctly regardless of
      # which of the two ways this run was actually triggered.
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from tag
        if: steps.tag.outputs.is_release == 'true'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG="${TAG#v}"
          # npm requires full semver (major.minor.patch). A shorthand tag
          # like v0.2 is only two parts and fails outright, so pad it to
          # v0.2.0 rather than let the whole build error out over it.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
            TAG="${TAG}.0"
          fi
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - run: npm install

      - name: Build and publish (tagged release)
        if: steps.tag.outputs.is_release == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (optional, currently unset — same "empty
          # string still gets treated as a real value" caveat as before
          # applies here too, so leave commented until real):
          #   CSC_LINK: ${{ secrets.CSC_LINK }}
          #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build only (manual test run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run dist

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: links-${{ matrix.os }}
          path: release/*
